[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus"]

[project]
name = "nexus-api"
version = "0.1.0"
description = "NEXUS OSINT Platform — FastAPI Backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # GraphQL
    "strawberry-graphql[fastapi]>=0.250.0",
    # WebSocket
    "python-socketio>=5.11.0",
    # Database drivers
    "neo4j>=5.25.0",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    # Task queue
    "celery[redis]>=5.4.0",
    # Kafka
    "aiokafka>=0.11.0",
    # Data validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Authentication
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=4.0.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # HTTP clients
    "aiohttp>=3.11.0",
    "httpx>=0.28.0",
    # CYBINT collectors
    "shodan>=1.31.0",
    "python-whois>=0.9.4",
    "aiodns>=3.2.0",
    # NLP
    "spacy>=3.8.0",
    # Logging
    "structlog>=24.4.0",
    # Utils
    "python-dotenv>=1.0.1",
    "orjson>=3.10.0",
    # SOCMINT collectors
    "telethon>=1.37.0",
    # LangGraph multi-agent
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    # Fusion / Entity resolution
    "scikit-learn>=1.5.0",
    "sentence-transformers>=3.3.0",
    # LLM
    "openai>=1.50.0",
    # GEOINT
    "geoip2>=4.8.0",
    "Pillow>=10.4.0",
    "mgrs>=1.4.0",
    "pyproj>=3.7.0",
    # Reports (Phase 3)
    "reportlab>=4.2.0",
    "Jinja2>=3.1.0",
    # Monitoring (Phase 4)
    "prometheus-client>=0.21.0",
    # Search (Phase 5)
    "elasticsearch[async]>=8.17.0",
    # Live feed (Phase 5 — Shadowbroker engine)
    "feedparser>=6.0.0",
    "yfinance>=0.2.0",
    "cachetools>=5.5.0",
    "sgp4>=2.22",
    # NER Tier 2 — domain models (Phase 5)
    "transformers>=4.46.0",
    "torch>=2.5.0",
    "gliner>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "S", "B"]
ignore = ["S101", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S311"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
